<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StyleBox</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="public/logo.webp" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anta&family=Passion+One:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <section>
        <div class="flex nav-cont">
            <div class="nav">
                <img class="logo" src="public/logo.webp">
                <div class="title">Style<span style="color: indigo;">Box</span></div>
                <div></div>
                <div class="flex pages">
                    <a href="#"><div  class="page active">Home</div></a>
                    <a href="#"><div  class="page">How to Use</div></a>
                    <a href="#"><div  class="page">Contact Dev</div></a>
                </div>
            </div>
        </div>

        <div class="main">
            <div class="flexc left">
                <div class="properties">
                    
                    <div class="property">
                        <label for="width">Width</label>
                        <div class="flex" style="gap:5%">
                            <input id="width" type="range" min="50" max="100">
                            <div class="value" id="v-width">00</div>
                        </div>
                    </div>
                    
                    <div class="property">
                        <label for="height">Height</label>
                        <div class="flex" style="gap:5%">
                            <input id="height" type="range" min="50" max="100">
                            <div class="value" id="v-height">00</div>
                        </div>
                    </div>

                </div>
            </div>
            <div class="right">

            </div>
            
            <div class="code">

            </div>
        </div>

    </section>
</body>
</html>
